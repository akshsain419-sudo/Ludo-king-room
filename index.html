
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo King Room</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
}
header {
  background: #16a34a;
  padding: 22px 10px;
  font-size: 27px;
  font-weight: bold;
}
.container { padding: 20px; }
.card {
  background: #1e293b;
  border-radius: 15px;
  padding: 20px;
  margin: 18px auto;
  max-width: 380px;
}
button {
  background: #22c55e;
  color: #06210e;
  border: 0;
  border-radius: 9px;
  padding: 13px 20px;
  margin: 6px;
  font-size: 16px;
  font-weight: bold;
}
.note { color: #cbd5e1; line-height: 1.6; }
</style>
</head>
<body>
<header>🎲 LUDO KING ROOM</header>
<div class="container">
  <div class="card">
    <h2>खेल की दुनिया में आपका स्वागत है!</h2>
    <p class="note">अपना गेम रूम चुनें और दोस्तों के साथ खेलें।</p>
    <button onclick="alert('गेम रूम जल्द उपलब्ध होगा!')">
      गेम रूम
    </button>
  </div>
  <div class="card">
    <h2>💰 वॉलेट डेमो</h2>
    <p>डेमो बैलेंस: ₹100</p>
    <p class="note">यह केवल डेमो है। असली पैसे जमा करने या निकालने की सुविधा नहीं है।</p>
    <button onclick="alert('यह डेमो वेबसाइट है।')">
      आगे बढ़ें
    </button>
  </div>
</div>
</body>
</html>
